<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Atkinson'; src: url('../node_modules/@fontsource/atkinson-hyperlegible-next/files/atkinson-hyperlegible-next-latin-700-normal.woff2'); font-weight: 700; }
  @font-face { font-family: 'Atkinson'; src: url('../node_modules/@fontsource/atkinson-hyperlegible-next/files/atkinson-hyperlegible-next-latin-400-normal.woff2'); font-weight: 400; }
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #040708; font-family: 'Atkinson'; position: relative; }
  /* The globe on the right, its rim just inside the card. */
  .globe { position: absolute; right: -150px; top: -205px; width: 1040px; height: 1040px; background: url('base-globe.png') center / cover; }
  .fade { position: absolute; inset: 0; background: linear-gradient(90deg, #040708 30%, rgba(4,7,8,0.6) 52%, rgba(4,7,8,0) 70%); }
  .sign { position: absolute; left: 72px; top: 150px; width: 520px; }
  .plate { background: #0e6651; color: #fff; border-radius: 8px; padding: 26px 34px 30px; }
  h1 { margin: 0; font-size: 92px; font-weight: 700; line-height: 1; letter-spacing: -0.015em; }
  .line { margin: 18px 0 0; font-size: 30px; line-height: 1.25; color: #d5ebe2; }
  .address { margin: 26px 0 0 4px; font-size: 26px; color: #e4ebed; }
</style>
</head>
<body>
  <div class="globe"></div>
  <div class="fade"></div>
  <div class="sign">
    <div class="plate">
      <h1>World transit</h1>
      <p class="line">Every route with an open schedule, on one globe, with live vehicles</p>
    </div>
    <p class="address">kylepace.dev/world-transit</p>
  </div>
</body>
</html>
