# Runs the tests (npm test) on every push and pull request: the weekly data job against
# saved real and broken schedules, and the live-position reader against a saved feed.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      # Node 24 runs the TypeScript scripts directly. The country lookup test needs
      # topojson-client and world-atlas, so install from the lockfile first.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
